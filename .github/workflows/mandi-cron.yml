name: Daily Govt Mandi Bhav Sync

on:
  schedule:
    # भारत समय अनुसार सुबह 7:00 बजे (UTC 01:30) अपने-आप चलेगा
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  sync-mandi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install @supabase/supabase-js
      - name: Ping data.gov.in API (debug)
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          DATA_GOV_RESOURCE_ID: ${{ secrets.DATA_GOV_RESOURCE_ID }}
        run: |
          url="https://api.data.gov.in/resource/$DATA_GOV_RESOURCE_ID?api-key=$DATA_GOV_API_KEY&format=json&limit=1"
          echo "Hitting data.gov.in (status only)..."
          curl -s -o /dev/null -w "HTTP=%{http_code}\n" "$url"
      - name: Run Fetch Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          DATA_GOV_RESOURCE_ID: ${{ secrets.DATA_GOV_RESOURCE_ID }}
        run: node scripts/fetch-mandi.mjs
